# TEMPORARY debug workflow for issue #557 / PR #562.
#
# `shell-tests` fails only on ubuntu-latest: ~30 assertions across three gate
# suites flip `expected=block got=allow`, and one suite reports `got=` empty.
# The suites pass locally on macOS under every Python (3.9/3.13/3.14) and Bash
# (3.2/5.3) combination tried, including against the exact GitHub-computed merge
# commit.
#
# The reason the failure is opaque is that the suites pipe the gate's stderr to
# /dev/null — so a gate that CRASHES produces empty stdout, which the harness
# scores as "allow". This workflow re-runs the suites with THAT redirection (and
# only that one) stripped from a COPY of each test file, so the gate's stderr
# reaches the job log.
#
# DELETE THIS FILE once the Linux divergence is identified.
name: debug-shell-tests

on:
  workflow_dispatch:
  push:
    branches:
      - issue-557-stdin-shell

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts

      - name: Runtime fingerprint
        run: |
          echo "bash:    $(bash --version | head -1)"
          echo "sh ->    $(readlink -f /bin/sh)"
          echo "python3: $(python3 --version)  ($(command -v python3))"
          echo "locale:  LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset}"
          python3 -c 'import sys,locale;print("fsencoding:",sys.getfilesystemencoding(),"preferred:",locale.getpreferredencoding())'

      - name: Single gate invocation with stderr visible
        # The narrowest possible probe: one command the CI run reports as
        # `expected=block got=allow`, run straight through the gate with stderr
        # kept. If the gate is raising, the traceback prints here.
        run: |
          set -x
          printf '%s' '{"tool_name":"Bash","cwd":"'"$PWD"'","tool_input":{"command":"rm -rf .claude/.skip-design-review-lease.d"}}' \
            | bash hooks/gate-scripts/pre-implementation-gate.sh
          echo "exit=$?"

      - name: Code identity — is the runner executing the same gate?
        # macOS and Linux return opposite MARKER_CHECK values for identical input
        # (BLOCK_MARKER_SCRIPT|lease_slot.py vs OK|). Before instrumenting further,
        # rule out the runner executing different bytes. Expected local sha256:
        #   pre-implementation-gate.sh 3a2ce68626b2b03ec3c58a097435e0cb351c4d81e94f546f7db709a25285c420
        #   lib/cmdword.py             c10a4113538da61d15e5e8f4f4be5d0f8baabd29c1ee22a9eb86f24c9d41b568
        # Expected symbol counts (from 4d00d13): 3 / 4 / 6 / 8.
        run: |
          sha256sum hooks/gate-scripts/pre-implementation-gate.sh hooks/gate-scripts/lib/cmdword.py
          for s in _lexed_words _launcher_in_any_simple_command _exec_payloads _helper_budget; do
            printf '%-34s %s\n' "$s" "$(grep -c "$s" hooks/gate-scripts/pre-implementation-gate.sh)"
          done
          echo "git HEAD: $(git rev-parse HEAD)"

      - name: Helper-guard probe (the guard that is actually inert)
        # The earlier single-gate probe used `rm -rf ...`, which never exercises
        # the helper guard — so it proved nothing. These are the EXACT generated
        # forms the suite reports as "105 of 105 allowed" on Linux; all six BLOCK
        # locally on macOS. Expect: {"decision":"block"} six times.
        run: |
          H='hooks/gate-scripts/lib/lease_'"slot.py"
          i=0
          for cmd in \
            "python3 -I $H .claude 20 0 3600" \
            "timeout 5 python3 -I $H .claude 20 0 3600" \
            "X=1 python3 -I $H .claude 20 0 3600" \
            "sudo python3 -I $H .claude 20 0 3600" \
            "sh -c 'python3 -I $H .claude 20 0 3600'" \
            "eval 'python3 -I $H .claude 20 0 3600'"; do
            i=$((i+1))
            out=$(python3 -c 'import json,sys;print(json.dumps({"tool_name":"Bash","cwd":sys.argv[1],"tool_input":{"command":sys.argv[2]}}))' "$PWD" "$cmd" \
                  | bash hooks/gate-scripts/pre-implementation-gate.sh)
            case "$out" in
              *'"block"'*) verdict=BLOCK ;;
              "")          verdict='allow(EMPTY STDOUT)' ;;
              *)           verdict=allow ;;
            esac
            printf '%-22s %s\n' "$verdict" "$cmd"
          done

      - name: Shell trace of one inert helper invocation
        # The Bash helper guard lives inside the MARKER_CHECK python launched at
        # ~line 249 — i.e. near the START of the run. A `tail` shows only the
        # design-fingerprint python at ~2641 and misses it entirely (that mistake
        # cost an iteration). Capture the whole trace, then report the head plus
        # the MARKER_CHECK decision specifically.
        run: |
          H='hooks/gate-scripts/lib/lease_'"slot.py"
          # mktemp, not a predictable shared path: on a persistent/self-hosted
          # runner a pre-created symlink at a fixed name would redirect this write.
          TRACE="$(mktemp)"
          python3 -c 'import json,sys;print(json.dumps({"tool_name":"Bash","cwd":sys.argv[1],"tool_input":{"command":sys.argv[2]}}))' \
            "$PWD" "python3 -I $H .claude 20 0 3600" \
            | bash -x hooks/gate-scripts/pre-implementation-gate.sh > "$TRACE" 2>&1 && rc=0 || rc=$?
          # Report the gate's exit status rather than swallowing it: a crash or an
          # unexpected nonzero here is itself a finding, not noise to discard.
          echo "gate exit: $rc   trace lines: $(wc -l < "$TRACE")"
          echo "::group::MARKER_CHECK / _TOOL decision"
          grep -nE "MARKER_CHECK|_TOOL=|_BLOCKED|blocked_helper|command -v python3" "$TRACE" | head -30
          echo "::endgroup::"
          echo "::group::first 120 trace lines"
          head -120 "$TRACE"
          echo "::endgroup::"
          # Diagnostics are printed first, then the gate's status decides the step.
          # The gate emits its decision as JSON and exits 0 for both allow and
          # block, so a nonzero here is a genuine fault and must fail the step.
          if [ "$rc" -ne 0 ]; then
            echo "gate exited $rc — unexpected; failing the step"
            exit "$rc"
          fi

      - name: Unmask the classifier's suppressed stderr
        # THE LIKELY ROOT CAUSE. The gate closes its MARKER_CHECK python with
        #     ' 2>/dev/null || echo "OK|")
        # so a non-zero exit becomes `OK|` (ALLOW) and the reason is discarded.
        # Linux returns `OK|` where macOS returns a real verdict on identical
        # bytes — the signature of a swallowed crash. Drop ONLY the 2>/dev/null
        # so the traceback is visible; keep the `|| echo` so control flow is
        # otherwise unchanged. The patched copy must sit beside the real gate,
        # which sources lib/resolve-repo-dir.sh relative to its own directory.
        run: |
          cat > /tmp/unmask.py <<'PY'
          import sys
          src_path, out_path = sys.argv[1], sys.argv[2]
          src = open(src_path).read()

          # Two layers hide the failure, and BOTH must come off or the traceback
          # is still lost:
          #   1. the classifier catches every Exception and prints OK| itself, so
          #      dropping the shell redirect alone shows nothing;
          #   2. the shell then discards stderr on that invocation.
          EDITS = [
              ('except Exception:\n    print("OK|")',
               'except Exception:\n'
               '    import traceback\n'
               '    traceback.print_exc(file=sys.stderr)\n'
               '    print("OK|")'),
              ("' 2>/dev/null || echo \"OK|\")", "' || echo \"OK|\")"),
          ]
          for anchor, replacement in EDITS:
              n = src.count(anchor)
              if n != 1:
                  sys.exit("anchor matched %d times, expected 1: %r" % (n, anchor[:40]))
              src = src.replace(anchor, replacement)

          open(out_path, "w").write(src)
          print("patched (handler traceback + stderr unmasked)")
          PY
          DBG=hooks/gate-scripts/pre-implementation-gate.dbg.sh
          python3 /tmp/unmask.py hooks/gate-scripts/pre-implementation-gate.sh "$DBG"
          H='hooks/gate-scripts/lib/lease_'"slot.py"
          echo "::group::classifier stderr (expect a traceback if it is crashing)"
          python3 -c 'import json,sys;print(json.dumps({"tool_name":"Bash","cwd":sys.argv[1],"tool_input":{"command":sys.argv[2]}}))' \
            "$PWD" "python3 -I $H .claude 20 0 3600" \
            | bash "$DBG"
          echo "::endgroup::"

      - name: cmdword.py import + classify probe
        # Isolates the library half of the security twin from the shell half.
        # `is_file_mod` is cmdword's ONLY public entry point — probing for any
        # other name would silently no-op instead of exercising the classifier.
        run: |
          cat > /tmp/cmdword_probe.py <<'PY'
          import sys, traceback
          sys.path.insert(0, "hooks/gate-scripts/lib")
          try:
              import cmdword
              print("import OK:", cmdword.__file__)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          if not hasattr(cmdword, "is_file_mod"):
              print("FATAL: cmdword.is_file_mod is missing — probe cannot classify")
              sys.exit(1)
          for cmd in [
              "rm -rf .claude/.skip-design-review-lease.d",
              "printf 'python3 hooks/gate-scripts/lib/lease_slot.py x' | script -q /dev/null",
              "env -S 'script .claude/bypass-log.jsonl'",
          ]:
              try:
                  print(repr(cmd), "-> is_file_mod =", cmdword.is_file_mod(cmd))
              except Exception:
                  print(repr(cmd), "-> RAISED")
                  traceback.print_exc()
          PY
          python3 /tmp/cmdword_probe.py

      - name: Re-run failing suites with gate stderr unmuted
        # Strip ONLY the gate-invocation redirect. A blanket `s| 2>/dev/null||g`
        # would also rewrite fixture commands that contain that text as part of
        # the input under test (e.g. `printf 'rm -rf src' | 2>/dev/null unshare`
        # at test-impl-gate-scope-519.sh:1073), changing what the suite asserts.
        # The suites name the gate via TWO different variables, so all three
        # anchored patterns below are needed:
        #   test-impl-gate-scope-519     ... | (cd "$WORK" && bash "$GATE") 2>/dev/null
        #   test-pre-implementation-gate ... | bash "$GATE" 2>/dev/null
        #   test-design-marker-worktree  ... | bash "$PREIMPL" 2>/dev/null   (24 sites)
        # Matching only $GATE would leave test-design-marker-worktree unchanged
        # and still hide the crash this workflow exists to expose.
        # Copies are written so the working tree stays pristine.
        run: |
          for t in test-impl-gate-scope-519 test-pre-implementation-gate test-design-marker-worktree; do
            echo "::group::$t (gate stderr unmuted)"
            sed -e 's|bash "\$GATE") 2>/dev/null|bash "$GATE")|g' \
                -e 's|bash "\$GATE" 2>/dev/null|bash "$GATE"|g' \
                -e 's|bash "\$PREIMPL" 2>/dev/null|bash "$PREIMPL"|g' \
                "tests/$t.sh" > "tests/$t.debug.sh"
            echo "-- redirects stripped: $(diff <(cat "tests/$t.sh") <(cat "tests/$t.debug.sh") | grep -c '^<') --"
            chmod +x "tests/$t.debug.sh"
            bash "tests/$t.debug.sh" 2>&1 | tail -120 || true
            echo "::endgroup::"
          done
