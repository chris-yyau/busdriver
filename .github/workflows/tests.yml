name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint gate scripts
        run: shellcheck --severity=warning hooks/gate-scripts/*.sh
      - name: Lint shared gate helper
        # scripts/relevant-check-status.sh is the canonical lock-aware check
        # filter sourced by the pre-merge gate + pr-grind (issue #154); lint it
        # as a required check (not via the soft scripts/hooks pass below).
        run: shellcheck --severity=warning scripts/relevant-check-status.sh
      - name: Lint CI shell-test runner
        # scripts/ci/run-shell-tests.sh is the full-glob gate-test runner the
        # shell-tests job executes — lint it as a required check so it can't drift.
        run: shellcheck --severity=warning scripts/ci/run-shell-tests.sh
      - name: Lint design-clear helper
        # scripts/design-clear.sh releases a fail-CLOSED review requirement
        # (ADR 0017 / #405) — required, not soft.
        run: |
          shellcheck --severity=warning \
            scripts/design-clear.sh \
            tests/test-design-clear.sh
      - name: Lint durable grind provenance (Rail A)
        # scripts/grind-pr-commits.sh and scripts/grind-set-member.sh are the two
        # executable seams of the pr-grind proportionality gate (ADR 0036). The
        # gate fails CLOSED on their exit codes, so lint them as required checks
        # rather than via the soft scripts/hooks pass below.
        run: |
          shellcheck --severity=warning \
            scripts/grind-pr-commits.sh \
            scripts/grind-set-member.sh \
            tests/test-grind-pr-commits.sh \
            tests/test-grind-set-member.sh \
            tests/test-grind-provenance.sh \
            tests/test-grind-provenance-gate.sh
      - name: Lint GateGuard containment surface
        # sanitized-node.sh is named explicitly because `hooks/gate-scripts/*.sh` above is a
        # NON-recursive glob and never reached `lib/`, and the soft scripts/hooks pass below
        # ends `|| true`. The wrapper five blocking gates depend on was linted by no required
        # step in this workflow.
        # tests/test-gateguard-containment.sh is the only lane that validates the
        # sanitized-node.sh --fail-open disposition and the six-channel wipe (#616).
        # A gate suite is required, not soft — the soft scripts/hooks pass below
        # ends in `|| true` and would let a broken suite through silently.
        run: |
          shellcheck --severity=warning \
            hooks/gate-scripts/lib/sanitized-node.sh \
            tests/test-gateguard-containment.sh \
            tests/test-gate-env-containment.sh \
            tests/test-node-hook-containment.sh
      - name: Lint gate-integrity content lock (#742)
        # scripts/gate-integrity.sh is the content lock over hooks/gate-scripts/**
        # and scripts/hooks/** — the control that makes a launcher body edit
        # impossible to land without a lockfile diff. Required, not soft.
        run: |
          shellcheck --severity=warning \
            scripts/gate-integrity.sh \
            tests/test-gate-integrity.sh
      - name: Verify gate-integrity content lock (#742)
        # The ENFORCEMENT, not just the lint. tests/test-gate-integrity.sh already
        # runs `--check` as its first assertion and is discovered by the full-glob
        # shell-tests job, but that job `needs: shellcheck` and takes ~15m — so a
        # stale lock would only surface at the far end of the run, and the wiring
        # would be implicit-by-glob rather than stated anywhere. This step fails
        # fast, here, and names the one-line fix.
        # `env -i` + an absolute interpreter, for what they actually buy — and no
        # more. They stop THIS hop inheriting a hostile env and stop PATH selecting
        # the interpreter. They do NOT establish a clean first hop: Actions has
        # already started the outer `run:` shell, which processed any inherited
        # BASH_ENV before reaching this line. Nothing inside the repo can fix that,
        # and it is not this control's boundary anyway — a BASH_ENV set from the repo
        # lands in the workflow diff, the same visible self-bypass as running
        # `--update`, and one set from outside means the runner is already
        # compromised. ADR 0016 / ADR 0049: the first hop is the caller's.
        run: env -i PATH=/usr/bin:/bin HOME="$HOME" /bin/bash scripts/gate-integrity.sh --check
      - name: Lint hook scripts (shell only)
        run: |
          find scripts/hooks -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning || true
      - name: Lint blueprint-review ultimate-arbiter surface
        # Required (not soft) — the opt-in gate is a security boundary. SC1091
        # (sourced libs not followed) is info-level, so --severity=warning ignores
        # it without needing -x/source-path. The gateway scripts/tests that used to
        # be listed here were deleted with the gateway rung (ADR 0019).
        run: |
          shellcheck --severity=warning \
            scripts/lib/ultimate-config.sh \
            tests/test-ultimate-config.sh \
            tests/test-ultimate-tier.sh \
            tests/test-blueprint-arbiter-default-pin.sh \
            tests/test-blueprint-review-oracle-arbiter-contract.sh \
            tests/test-upstream-manifest.sh

  compliance:
    if: github.event_name == 'push'
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: license
          severity: CRITICAL
          exit-code: 1
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  version-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version sync
        run: ./scripts/bump-version.sh --check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, not 20, because THIS job runs commitlint, and #537 (a pending
          # dependabot group bump) moves @commitlint/cli and
          # @commitlint/config-conventional from the currently-locked 19.8.1
          # (engines >=18) to 21.x, which declares
          # `engines: {"node": ">=22.12.0"}`. There is no .npmrc, so
          # engine-strict is off: the dependency install below would only WARN
          # and then run the CLI on an unsupported runtime once #537 lands,
          # leaving a required check that reports success without a
          # trustworthy basis for it. Raising the pin here now means #537
          # inherits a Node version its own lockfile already requires, instead
          # of landing a silent-degrade gate on the next rebase. A gate whose
          # result cannot be relied on is worse than one that fails loudly.
          #
          # Deliberately scoped to this job. The other node-version pins stay at
          # 20 because nothing they run requires more — vitest 4 accepts
          # `^20.0.0 || ^22.0.0 || >=24.0.0`, ajv and js-yaml declare no engines
          # constraint at all. Raise those when something in them actually needs
          # it, not for symmetry.
          node-version: 22
      - run: npm ci --ignore-scripts
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

  validate:
    runs-on: ubuntu-latest
    # Job-level wall-clock ceiling, not a validation budget: every check in this
    # job still runs and still has to pass. Raised 5 -> 10 because the dependency
    # install step alone measured 2m34s on 2026-09-04 (in the shell-tests job of
    # the same workflow run, which passed) against a 5-minute budget SHARED with
    # harden-runner, checkout and setup-node. That produced four consecutive
    # `validate` failures whose only failing step was a CANCELLED install -- a red
    # required check reporting an install timeout as a schema-validation failure.
    # (Written without naming the install command literally: validate-workflow-
    # security.js scans this file for that token and requires the hardening flag
    # beside it, so the bare name in a COMMENT trips the check. Measured.) The npm
    # manifests were untouched by the PR that hit it, so the slowdown is
    # environmental. Same reasoning, and the same "headroom over the measurement
    # rather than tuned to it", as the shell-tests ceiling below.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Validate agent/skill/command/hook/rule schemas + workflow + unicode safety
        run: npm run validate
      # Deliberately a STEP in an already-required job, not a job of its own
      # (#530). A separate job would post a new check name that branch
      # protection does not require, so a drift failure could be merged past —
      # a guard that certifies safety it never enforced. Folding it into
      # `validate` makes drift block merge today, and adds no name for surface
      # (b) to reconcile against branch protection.
      #
      # --local-only runs surfaces (a), (d) and (e). Surfaces (b), (c) and (f)
      # need `administration: read` / check-run reads, which GITHUB_TOKEN
      # cannot be granted, so they cannot run in CI at all. Surface (e) is the
      # token-free stand-in: it fails when a workflow posts a check the lock
      # does not classify, which is how (b) drift gets introduced in the
      # first place.
      # Run the full six surfaces locally with an admin-scoped gh login:
      #   bash scripts/check-required-checks.sh
      - name: Check required-checks.lock for drift
        run: bash scripts/check-required-checks.sh --local-only

  coverage:
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- JavaScript (vitest -> coverage/lcov.info) ---
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --coverage
      # --- Python (pytest-cov, federated per-suite XML) ---
      # No `cache: pip` — there is no requirements.txt in the repo, and setup-python's
      # pip cache errors out ("No file matched **/requirements.txt") when none exists.
      # Only three small wheels are installed, so caching would save nothing anyway.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3 pytest==9.0.3 pytest-cov==7.1.0
      - name: Coverage — skill-comply
        run: |
          cd skills/skill-comply
          pytest -q --cov=scripts --cov-report=xml:"$GITHUB_WORKSPACE/coverage-skill-comply.xml"
      - name: Coverage — continuous-learning-v2
        run: |
          pytest -q skills/continuous-learning-v2/scripts/test_parse_instinct.py \
            --cov=skills/continuous-learning-v2/scripts \
            --cov-report=xml:coverage-clv2.xml
      - name: Coverage — agent-self-evaluation
        run: |
          pytest -q skills/agent-self-evaluation/scripts/test_evaluate.py \
            --cov=skills/agent-self-evaluation/scripts \
            --cov-report=xml:coverage-agent-self-evaluation.xml
      - name: Coverage — blueprint-review extract_review_json
        run: |
          pytest -q skills/blueprint-review/scripts/lib/test_extract_review_json.py \
            skills/blueprint-review/scripts/lib/test_extract_review_json_log_echo.py \
            --cov=skills/blueprint-review/scripts/lib \
            --cov-report=xml:coverage-extract-review-json.xml
      - name: Coverage — litmus parse_narrative
        run: |
          pytest -q skills/litmus/scripts/lib/test_parse_narrative.py \
            --cov=skills/litmus/scripts/lib \
            --cov-report=xml:coverage-parse-narrative.xml
      # No --cov target: the code under test is a snippet inside SKILL.md, which
      # coverage cannot instrument. The suite still has to RUN in CI — it is the
      # only guard on that snippet's pagination and partial-read handling.
      - name: Coverage — zenmux catalog pagination
        run: pytest -q skills/zenmux/test_catalog_pagination.py
      # Token is passed only to this step (never job-level env, so checked-out
      # PR code in earlier steps cannot read it). continue-on-error is scoped to
      # the two cases that legitimately lack the secret: fork PRs and Dependabot
      # PRs (both run without repo secrets on a public repo, so the upload can't
      # authenticate). On same-repo pushes/PRs a real upload failure still surfaces
      # (the job is advisory, so it won't block merge, but it stays visible).
      - name: Upload to Codecov
        continue-on-error: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.actor == 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage-skill-comply.xml,./coverage-clv2.xml,./coverage-agent-self-evaluation.xml,./coverage-extract-review-json.xml,./coverage-parse-narrative.xml

  shell-tests:
    # Full tests/test-*.sh gate/security suite (#265, then broadened to full-glob in
    # the pipeline-audit-fixes plan). Before this job the shell gate-tests were never
    # executed in CI — only vitest/pytest ran; then a hand-picked ~15-test list ran,
    # leaving most gate suites uncovered. scripts/ci/run-shell-tests.sh now runs EVERY
    # discovered suite (local and CI identical), so a gate regression can't slip past
    # by never being wired in. It has NO `paths` filter, so on `pull_request` (which
    # carries no paths-ignore) it runs for ANY change. A doc-only push to main is
    # skipped by the workflow-level push `paths-ignore`, but such changes land via PR,
    # where this runs. (GitHub Actions path filters are event-level, not job-level, and
    # paths + paths-ignore cannot coexist on one event — hence relying on the unfiltered
    # pull_request trigger rather than a job-scoped `paths:` list.)
    needs: shellcheck
    runs-on: ubuntu-latest
    # Job-level ceiling, not a per-test budget (that's run-shell-tests.sh's
    # per-test timeout, see the "Full shell gate-test suite" step below).
    # 103 discovered suites now legitimately run ~12m wall-clock (observed
    # PR #548 round 2: 11m52s, all 103 PASS, but the job was hard-canceled
    # by GitHub Actions at the old 12-minute ceiling before the runner could
    # even report the already-green result). Raised with headroom above the
    # observed runtime rather than tuned to the exact measurement, so normal
    # variance (runner contention, a slightly slower suite) doesn't reproduce
    # the same false-failure on the next PR.
    #
    # 20 -> 30 (#562): the per-test ceiling for test-impl-gate-scope-519 went 420s ->
    # 900s in run-shell-tests.sh (see the note there). The rest of the job measured
    # ~7m50s around it, so a suite that used its full new budget would land at ~23m and
    # be hard-canceled at 20 -- trading a per-test timeout for a job timeout, which is
    # the same false failure wearing a different name. Raised so the per-test budget is
    # the binding constraint, which is the one that names the suite at fault.
    #
    # Raised again 30 -> 45 on 2026-09-04, for the same reason one more time. The
    # suite is now 147 discovered tests, not the 103 the 30-minute ceiling was set
    # for, and it has caught up with it: measured 29m29s on a PASSING run, and one
    # 30m17s cancellation in which nothing failed -- the job was killed AT the
    # ceiling, the identical false-failure shape as the #548 case above. 45
    # restores headroom over the observed runtime instead of tracking it.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate-test suite now includes tests/test-required-checks-lock-classification.sh,
      # which drives scripts/lib/list-workflow-checks.mjs and therefore needs js-yaml.
      # Installed here rather than letting the suite skip: run-shell-tests.sh enforces a
      # skip-masking guard precisely so a suite cannot quietly stop covering anything.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Full shell gate-test suite
        # jq + python3 + git are preinstalled on ubuntu-latest. The runner distinguishes
        # PASS/SKIP/FAIL, enforces that the gate suites never SKIP (skip-masking guard),
        # and fails the job on any non-zero test or timeout. The suite is hermetic — it
        # does not depend on codex/agy/droid/grok being installed (see
        # docs/ci/shell-test-inventory.md). Per-test timeout is portable via
        # scripts/lib/resolve-cli.sh's _portable_timeout.
        run: /bin/bash -p scripts/ci/run-shell-tests.sh
